name: B17 laboratory checks

on:
  pull_request:
    branches: [master]
    paths:
      - "labs/b17/**"
      - ".github/workflows/b17-lab.yml"
  push:
    branches:
      - "chatgpt/b17-second-consolidation-labs"
    paths:
      - "labs/b17/**"
      - ".github/workflows/b17-lab.yml"

jobs:
  b17-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run B17 Python data engineering tests
        run: python -m unittest discover -s labs/b17/tests -v
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Run B17 R data engineering checks
        run: Rscript labs/b17/data_pipeline_lab.R
