name: Build and deploy Programme B

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run B08 Python laboratory tests
        run: python -m unittest discover -s labs/b08/tests -v
      - name: Run B09 Python stochastic laboratory tests
        run: python -m unittest discover -s labs/b09/tests -v
      - name: Run B10 Python descriptive laboratory tests
        run: python -m unittest discover -s labs/b10/tests -v
      - name: Run B11 Python inference laboratory tests
        run: python -m unittest discover -s labs/b11/tests -v
      - name: Run B12 Python regression laboratory tests
        run: python -m unittest discover -s labs/b12/tests -v
      - name: Run B13 Python multivariate laboratory tests
        run: python -m unittest discover -s labs/b13/tests -v
      - name: Run B14 Python causal laboratory tests
        run: python -m unittest discover -s labs/b14/tests -v
      - name: Run B15 Python machine learning laboratory tests
        run: python -m unittest discover -s labs/b15/tests -v
      - name: Run B16 Python time series laboratory tests
        run: python -m unittest discover -s labs/b16/tests -v
      - name: Run B17 Python data engineering tests
        run: python -m unittest discover -s labs/b17/tests -v
      - name: Run B18 Python actuarial tests
        run: python -m unittest discover -s labs/b18/tests -v
      - name: Run B19 Python econometrics tests
        run: python -m unittest discover -s labs/b19/tests -v
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Run B08 R laboratory checks
        run: Rscript labs/b08/probability_lab.R
      - name: Run B09 R stochastic laboratory checks
        run: Rscript labs/b09/stochastic_lab.R
      - name: Run B10 R descriptive laboratory checks
        run: Rscript labs/b10/descriptive_lab.R
      - name: Run B11 R inference laboratory checks
        run: Rscript labs/b11/inference_lab.R
      - name: Run B12 R regression laboratory checks
        run: Rscript labs/b12/regression_lab.R
      - name: Run B13 R multivariate laboratory checks
        run: Rscript labs/b13/multivariate_lab.R
      - name: Run B14 R causal laboratory checks
        run: Rscript labs/b14/causal_lab.R
      - name: Run B15 R machine learning laboratory checks
        run: Rscript labs/b15/ml_lab.R
      - name: Run B16 R time series laboratory checks
        run: Rscript labs/b16/time_series_lab.R
      - name: Run B17 R data engineering checks
        run: Rscript labs/b17/data_pipeline_lab.R
      - name: Run B18 R actuarial checks
        run: Rscript labs/b18/actuarial_lab.R
      - name: Run B19 R econometrics checks
        run: Rscript labs/b19/econometrics_lab.R
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check and build
        run: npm run build
      - name: Validate lesson Markdown and KaTeX rendering
        run: npm run validate:content
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
