name: B18 actuarial laboratory checks

on:
  pull_request:
    branches: [master]
    paths:
      - "labs/b18/**"
      - ".github/workflows/b18-lab.yml"
  push:
    branches:
      - "chatgpt/b18-actuarial-risk-consolidation"
    paths:
      - "labs/b18/**"
      - ".github/workflows/b18-lab.yml"

jobs:
  b18-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run B18 Python actuarial tests
        run: python -m unittest discover -s labs/b18/tests -v
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Run B18 R actuarial checks
        run: Rscript labs/b18/actuarial_lab.R
